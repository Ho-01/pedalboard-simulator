server {
    listen 80;
    server_name pedal.34-59-139-83.sslip.io;
    root /var/www/pedalboard-simulator/current;
    location /.well-known/acme-challenge/ { root /var/www/pedalboard-simulator/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name pedal.34-59-139-83.sslip.io;
    ssl_certificate /etc/letsencrypt/live/pedal.34-59-139-83.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedal.34-59-139-83.sslip.io/privkey.pem;
    root /var/www/pedalboard-simulator/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location /assets/ {
        alias /var/www/pedalboard-simulator/shared/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /engine/ {
        alias /var/www/pedalboard-simulator/shared/engine/;
        types {
            application/javascript mjs;
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /version.json { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
